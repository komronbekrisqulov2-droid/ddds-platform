# DDDS Cloud - Production Nginx Reverse Proxy Configuration
# Fayl manzili: /etc/nginx/sites-available/ddds.conf

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name sizning-domeningiz.uz www.sizning-domeningiz.uz;

    # Katta PPTX/PDF taqdimotlar yuklash uchun hajm limiti
    client_max_body_size 100M;

    # Static fayllarni tezkor kesh bilan yetkazish
    location /static/ {
        alias /var/www/ddds/app/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Barcha HTTP va WebSocket so'rovlarini FastAPI (Uvicorn) ga yo'naltirish
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket sarlavhalari (WSS uchun shart)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebRTC signaling va uzoq vaqt faol bo'lgan darslar uchun timeoutlar
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

